name: Look at the update feed

# Reads the published update feed as a Native App does, each week, and fails while there is time to act:
# the feed ends soon, its signature is not one the apps trust, or a file it names is gone.

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  look:
    name: Signature, date and files
    # Nothing to look at until the apps are built to read one.
    if: vars.INSTALLED_UPDATE_FEED_URL != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node scripts/native-apps/check-feed.mjs "$FEED_URL" apps/desktop/update-keys.json
        env:
          FEED_URL: ${{ vars.INSTALLED_UPDATE_FEED_URL }}
