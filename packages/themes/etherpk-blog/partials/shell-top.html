<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="generator" content="EtherPK">
    <title>{{page.title}}{{^page.isHome}} · {{site.title}}{{/page.isHome}}</title>
    {{#page.excerpt}}<meta name="description" content="{{page.excerpt}}">{{/page.excerpt}}
    <link rel="stylesheet" href="theme/theme.css">
    {{#site.hasMath}}<link rel="stylesheet" href="theme/katex/katex.min.css">{{/site.hasMath}}
    {{#site.hasCustomCss}}<link rel="stylesheet" href="theme/custom.css">{{/site.hasCustomCss}}
    {{#site.hasFeed}}<link rel="alternate" type="application/rss+xml" title="{{site.title}}" href="feed.xml">{{/site.hasFeed}}
    {{> head}}
</head>
<body class="layout-blog{{#page.isHome}} is-home{{/page.isHome}}{{#page.isJournal}} is-journal{{/page.isJournal}}">
    <a class="skip-link" href="#content">Skip to content</a>
    {{> header}}
    <main id="content" class="content">
        {{> before-content}}
