{{> shell-top}}
        <article class="post">
            <header class="post-header">
                <h1>{{{page.titleHtml}}}</h1>
                {{#page.hasDate}}<time class="post-date" datetime="{{page.date}}">{{page.date}}</time>{{/page.hasDate}}
            </header>
            <div class="post-body">
{{{page.content}}}
            </div>
        </article>
{{> shell-bottom}}
