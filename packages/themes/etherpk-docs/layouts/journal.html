{{> shell-top}}
            <article class="page">

                    <h1>{{{page.titleHtml}}}</h1>
                    {{#page.hasDate}}<time class="page-date" datetime="{{page.date}}">{{page.date}}</time>{{/page.hasDate}}
                </header>
{{> toc}}
                <div class="page-body">
{{{page.content}}}
                </div>
            </article>
{{> shell-bottom}}
