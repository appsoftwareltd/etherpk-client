    <header class="header">
        <nav class="nav" aria-label="Site">
            <div class="logo">
                <a class="site-title" href="index.html">{{> logo}}<span class="site-title-text">{{site.title}}</span></a>
                <button class="theme-toggle" type="button" aria-label="Toggle light and dark" aria-pressed="false">
                    <svg class="moon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                    <svg class="sun" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                </button>
            </div>
            <ul id="menu" class="site-nav-list">
{{#nav}}{{> nav-item}}{{/nav}}
                <li class="menu-search">
                    <form class="site-search" role="search" data-search-index="{{site.search.url}}" data-search-script="{{site.search.scriptUrl}}">
                        <label class="visually-hidden" for="site-search-input">Search</label>
                        <input id="site-search-input" type="search" name="q" placeholder="Search" autocomplete="off">
                        <div class="site-search-results" role="listbox" hidden></div>
                    </form>
                </li>
            </ul>
        </nav>
    </header>
