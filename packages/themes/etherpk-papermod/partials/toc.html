            {{#page.hasToc}}

                <details>
                    <summary accesskey="c">Table of contents</summary>
                    <div class="inner"><ul>
                        {{#page.toc}}<li class="toc-level-{{level}}"><a href="#{{id}}">{{text}}</a></li>{{/page.toc}}
                    </ul></div>
                </details>
            </div>
