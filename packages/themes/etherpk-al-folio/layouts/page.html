{{> shell-top}}
        <article class="post">
            <header class="post-header">
                <h1 class="post-title">{{{page.titleHtml}}}</h1>
                <p class="post-meta">{{#page.hasDate}}<time datetime="{{page.date}}">{{page.date}}</time> · {{/page.hasDate}}{{page.readingMinutes}} min read</p>
            </header>
{{> toc}}
            <div class="post-content">
{{{page.content}}}
            </div>
            <nav class="post-nav" aria-label="Neighbouring posts">
                {{#page.older}}<a class="older" href="{{url}}">← {{title}}</a>{{/page.older}}
                {{#page.newer}}<a class="newer" href="{{url}}">{{title}} →</a>{{/page.newer}}
            </nav>
        </article>
{{> shell-bottom}}
