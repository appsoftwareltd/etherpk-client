packages:
  - 'apps/*'
  - 'packages/*'
  - 'extensions/*'

injectWorkspacePackages: true

# A version must have been published for 7 days (in minutes) before pnpm resolves it, which gives the
# community time to find and pull a compromised release. Set explicitly, the check is strict: an
# install that needs a younger version fails, CI's frozen install included. Let an urgent fix through
# by naming that version under minimumReleaseAgeExclude, with the reason beside it.
minimumReleaseAge: 10080

# Floors for transitive dependencies with published advisories, each within the major its parents
# ask for, so a fresh resolution cannot fall back to a vulnerable version. cookie is the exception:
# SvelteKit 2 still asks for ^0.6.0, which GHSA-pxg6-pf52-xh8x covers, and 0.7 keeps the same API.
overrides:
  'brace-expansion@<1.1.21': ^1.1.21
  'brace-expansion@>=4.0.0 <5.0.12': ^5.0.12
  'cookie@<0.7.0': ^0.7.2
  'dompurify@<3.4.17': ^3.4.17
  'esbuild@<0.28.1': ^0.28.1
  'fast-uri@<3.1.9': ^3.1.9
  'hono@>=4.0.0 <4.13.11': ^4.13.11
  '@hono/node-server@>=2.0.0 <2.1.3': ^2.1.3
  'ip-address@<10.7.1': ^10.7.1
  'nanoid@<3.3.18': ^3.3.18
  'postcss@<8.5.23': ^8.5.23
  # @tailwindcss/typography pins 6.0.10. It runs only in the build, over our own CSS, and 6.1.5
  # keeps the 6.x API it uses.
  'postcss-selector-parser@<6.1.5': ^6.1.5
  'postcss-selector-parser@>=7.0.0 <7.1.6': ^7.1.6
  'proxy-addr@<2.0.8': ^2.0.8
  'qs@>=6.0.0 <6.16.1': ^6.16.1
  'source-map-js@<1.2.2': ^1.2.2
  'undici@>=7.0.0 <7.30.1': ^7.30.1
  'vite@>=8.3.0 <8.3.3': ^8.3.3

allowBuilds:
  esbuild: true
