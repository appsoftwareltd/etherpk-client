<!doctype html>
<html lang="en">

    <head>
        <meta charset="utf-8" />
        <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
        <link rel="manifest" href="/site.webmanifest" />
        <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
        <meta name="theme-color" content="#0f0f0f" media="(prefers-color-scheme: dark)" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <!-- interactive-widget: a phone's keyboard resizes the page, where the browser can (Chrome and
             Firefox on Android), so the workspace gets shorter with it and the browser has no reason to
             move the page under the keyboard. Elsewhere see lib/layout/keyboard-inset.ts. -->
        <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
        <script>
            (() => {
                const cookieName = 'etherpk-theme';
                const supportedPreferences = new Set(['light', 'dark', 'system']);
                const cookieValue = document.cookie
                    .split(';')
                    .map((entry) => entry.trim())
                    .find((entry) => entry.startsWith(`${cookieName}=`))
                    ?.slice(cookieName.length + 1);
                // A link from another EtherPK app carries its theme in the fragment
                // (#theme=dark, see theme.ts). Keep it in this host's cookie and take it off
                // the address, so every app shows the theme the person last chose.
                const handedOver = location.hash.startsWith('#theme=') ? location.hash.slice(7) : null;
                if (handedOver !== null) {
                    history.replaceState(history.state, '', location.pathname + location.search);
                }
                const carried = supportedPreferences.has(handedOver) ? handedOver : null;
                if (carried) {
                    document.cookie = `${cookieName}=${carried}; Path=/; Max-Age=31536000; SameSite=Lax`;
                }
                const preference = carried ?? (supportedPreferences.has(cookieValue) ? cookieValue : 'system');
                const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                const resolvedTheme = preference === 'system' ? (systemPrefersDark ? 'dark' : 'light') : preference;
                const root = document.documentElement;

                root.dataset.themePreference = preference;
                root.dataset.theme = resolvedTheme;
                root.classList.toggle('dark', resolvedTheme === 'dark');
                root.style.colorScheme = resolvedTheme;
            })();
        </script>
        <script>
            // Chromium's install offer can fire before the app starts; hold it for app-install.ts.
            window.addEventListener('beforeinstallprompt', (event) => {
                event.preventDefault();
                window.__etherpkInstallOffer = event;
            });
        </script>
        %sveltekit.head%
    </head>

    <body data-sveltekit-preload-data="hover">
        <div style="display: contents">%sveltekit.body%</div>
    </body>

</html>
