# Every version here was at least seven days old when it was chosen, as for the npm packages
# (minimumReleaseAge in pnpm-workspace.yaml). gradle/verification-metadata.xml holds the checksum of
# each file: after changing a version, run
#   ./gradlew --write-verification-metadata sha256 assembleDirectRelease testDirectDebugUnitTest lintDirectDebug assembleDirectDebugAndroidTest
[versions]
agp = "9.5.1"
webkit = "1.18.0"
browser = "1.10.0"
activity = "1.13.0"
core = "1.19.1"
bouncycastle = "1.87"
junit = "4.13.2"
json = "20260814"
test-runner = "1.7.0"
test-ext = "1.3.0"
uiautomator = "2.4.1"

[libraries]
webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
browser = { module = "androidx.browser:browser", version.ref = "browser" }
activity = { module = "androidx.activity:activity", version.ref = "activity" }
core = { module = "androidx.core:core", version.ref = "core" }
bouncycastle = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
junit = { module = "junit:junit", version.ref = "junit" }
json = { module = "org.json:json", version.ref = "json" }
test-runner = { module = "androidx.test:runner", version.ref = "test-runner" }
test-ext = { module = "androidx.test.ext:junit", version.ref = "test-ext" }
uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
